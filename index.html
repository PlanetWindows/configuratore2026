<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Windows Configurator Professional</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f2ef;color:#231f20}
    .pw-loader{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .pw-loader strong{display:block;font-size:20px;margin-bottom:8px}.pw-loader span{color:#777;font-size:13px}
  </style>
</head>
<body>
  <div class="pw-loader"><div><strong>Planet Windows</strong><span>Caricamento configuratore...</span></div></div>
  <script>
    (async function () {
      const baseCommit = 'c2205ef79b08298fbfec4f83e093c212e70a0c52';
      const sources = [
        `https://raw.githubusercontent.com/PlanetWindows/configuratore2026/${baseCommit}/index.html`,
        `https://cdn.jsdelivr.net/gh/PlanetWindows/configuratore2026@${baseCommit}/index.html`
      ];
      let html = '';
      let lastError = null;
      for (const source of sources) {
        try {
          const response = await fetch(source, { cache: 'no-store', mode: 'cors' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          html = await response.text();
          if (html && /<\/body>/i.test(html)) break;
        } catch (error) {
          lastError = error;
          html = '';
        }
      }
      if (!html) {
        document.querySelector('.pw-loader').innerHTML = `<div><strong>Impossibile caricare il configuratore</strong><span>Aggiorna la pagina e riprova.${lastError ? ` (${String(lastError.message || lastError)})` : ''}</span></div>`;
        return;
      }
      const door72Old = 'Portoncino antipanico dx | Portoncino antipanico sx | Pontoncino antipanico dx con traverso | Portoncino antipanico 2 ante sx | Portoncino antipanico 2 ante asimmetriche o interno dx | Portoncino interno sx | Portoncino interno con tarverso | Portoncino interno con sopraluce | Portoncino interno con trapezio | Portoncino interno arco ribassato | Portoncino interno arco a tutto sesto | Portoncino interno fianco luce dx | Portoncino interno fianco luce sx | Portoncino interno con 2 ante sopraluce | Portoncino interno 2 ante traverso | Portoncino interno 2 ante arco ribassato | Portoncino interno 2 ante arco a tutto sesto';
      const door72New = 'Portoncino antipanico dx | Portoncino antipanico sx | Pontoncino antipanico dx con traverso | Portoncino antipanico 2 ante sx | Portoncino antipanico 2 ante asimmetriche | Portoncino interno dx | Portoncino interno sx | Portoncino interno con tarverso | Portoncino interno con sopraluce | Portoncino interno fianco luce dx | Portoncino interno fianco luce sx | Portoncino interno con 2 ante sopraluce | Portoncino interno 2 ante traverso';
      html = html.replace(door72Old, door72New);
      const zipBase = 'https://cdn.jsdelivr.net/gh/PlanetWindows/configuratore2026@957b9d1ee15c2ebc49fca0b43f8b9e7448a8bd17/';
      const enhancementTag =
        '<style id="pw-hide-opening-preview">.serramento .opening-visual{display:none!important;visibility:hidden!important}</style>' +
        '<script src="pw-enhancements.js?v=20260907-4"></scr' + 'ipt>' +
        '<script src="pw-category-color-fix.js?v=20260907-1"></scr' + 'ipt>' +
        '<script src="pw-preview-visibility.js?v=20260907-2"></scr' + 'ipt>' +
        '<script src="pw-alluminio-assets-1.js?v=20260907-zip1"></scr' + 'ipt>' +
        '<script src="pw-alluminio-assets-2.js?v=20260907-zip1"></scr' + 'ipt>' +
        '<script src="pw-alluminio-assets-3.js?v=20260907-zip1"></scr' + 'ipt>' +
        '<script src="pw-alluminio-assets-4.js?v=20260907-zip1"></scr' + 'ipt>' +
        '<script src="pw-alluminio-assets-5.js?v=20260907-zip1"></scr' + 'ipt>' +
        '<script src="pw-alluminio-assets-6.js?v=20260907-zip1"></scr' + 'ipt>' +
        '<script src="pw-alluminio-assets-7.js?v=20260907-zip1"></scr' + 'ipt>' +
        '<script src="pw-alluminio-only.js?v=20260907-zip1"></scr' + 'ipt>' +
        '<script src="pw-alluminio-color-only.js?v=20260907-color5"></scr' + 'ipt>' +
        '<script>window.PW_ZIP_OPENINGS=[];window.PW_ZIP_COLLISIONS={};</scr' + 'ipt>' +
        '<script src="' + zipBase + 'pw-zip-collisions.js"></scr' + 'ipt>' +
        '<script src="' + zipBase + 'pw-zip-pvc.js"></scr' + 'ipt>' +
        '<script src="' + zipBase + 'pw-zip-alluminio.js"></scr' + 'ipt>' +
        '<script src="pw-opening-canonical.js?v=20260908-1"></scr' + 'ipt>' +
        '<script src="pw-opening-family-guard.js?v=20260908-3"></scr' + 'ipt>' +
        '<script src="pw-family-summary-only.js?v=20260908-4"></scr' + 'ipt>' +
        '<script src="pw-opening-family-authority.js?v=20260908-5"></scr' + 'ipt>' +
        '<script src="pw-pvc-openings-authority.js?v=20260908-6"></scr' + 'ipt>' +
        '<script src="pw-reverii-clean.js?v=20260909-1"></scr' + 'ipt>' +
        '<script src="pw-internal-color-only.js?v=20260909-1"></scr' + 'ipt>';
      html = html.replace(/<\/body>/i, enhancementTag + '</body>');
      document.open();document.write(html);document.close();
    })();
  </script>
</body>
</html>
