<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Windows Configurator Professional</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f2ef;color:#231f20}
    .pw-loader{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .pw-loader strong{display:block;font-size:20px;margin-bottom:8px}.pw-loader span{color:#777;font-size:13px}
  </style>
</head>
<body>
  <div class="pw-loader"><div><strong>Planet Windows</strong><span>Caricamento configuratore...</span></div></div>
  <script>
    (async function () {
      const baseCommit = 'c2205ef79b08298fbfec4f83e093c212e70a0c52';
      const sources = [
        `https://raw.githubusercontent.com/PlanetWindows/configuratore2026/${baseCommit}/index.html`,
        `https://cdn.jsdelivr.net/gh/PlanetWindows/configuratore2026@${baseCommit}/index.html`
      ];
      let html = '';
      let lastError = null;
      for (const source of sources) {
        try {
          const response = await fetch(source, { cache: 'no-store', mode: 'cors' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          html = await response.text();
          if (html && /<\/body>/i.test(html)) break;
        } catch (error) {
          lastError = error;
          html = '';
        }
      }
      if (!html) {
        document.querySelector('.pw-loader').innerHTML = `<div><strong>Impossibile caricare il configuratore</strong><span>Aggiorna la pagina e riprova.${lastError ? ` (${String(lastError.message || lastError)})` : ''}</span></div>`;
        return;
      }
      const enhancementTag = '<script src="pw-enhancements.js?v=20260907-2"></scr' + 'ipt>' + '<script src="pw-category-color-fix.js?v=20260907-1"></scr' + 'ipt>' + '<script src="pw-preview-visibility.js?v=20260907-1"></scr' + 'ipt>' + '<script src="pw-alluminio-only.js?v=20260907-1"></scr' + 'ipt>';
      html = html.replace(/<\/body>/i, enhancementTag + '</body>');
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</body>
</html>
